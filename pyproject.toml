[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "steamdt-mcp"
version = "0.1.0"
description = "SteamDT MCP server for querying CS2 item prices and market data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Kir4kami", email = "kir4kami@users.noreply.github.com"},
]
keywords = ["mcp", "steamdt", "cs2", "steam", "market", "price"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/Kir4kami/mcp-steamdt"
Documentation = "https://github.com/Kir4kami/mcp-steamdt#readme"
Repository = "https://github.com/Kir4kami/mcp-steamdt"
Issues = "https://github.com/Kir4kami/mcp-steamdt/issues"

[project.scripts]
steamdt-mcp = "steamdt_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["steamdt_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/steamdt_mcp",
    "/scripts",
    "/README.md",
    "/USAGE.md",
    "/requirements.txt",
]

